services:
  - type: web
    name: matrimony
    env: docker
    dockerfilePath: ./docker/Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Required by the first-run setup wizard; find it in the Render dashboard.
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: matrimony-db
          property: connectionString
      - key: PORT
        value: 8000

databases:
  - name: matrimony-db
    databaseName: matrimony
    plan: free
